name: hr-test

x-test-env: &test-env
  APP_NAME: VACANCY-TEST.ATU.KZ
  APP_ENV: staging
  APP_DEBUG: "false"
  APP_KEY: ${HR_TEST_APP_KEY:?HR_TEST_APP_KEY is required}
  APP_URL: https://vacancy-test.atu.kz
  APP_TIMEZONE: Asia/Almaty
  APP_LOCALE: ru
  APP_FALLBACK_LOCALE: ru
  LOG_CHANNEL: stack
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: hr_test
  DB_USERNAME: hr_test
  DB_PASSWORD: ${HR_TEST_DB_PASSWORD:?HR_TEST_DB_PASSWORD is required}
  CACHE_STORE: database
  CACHE_PREFIX: hr_test_
  SESSION_DRIVER: database
  SESSION_COOKIE: vacancy_test_session
  SESSION_SECURE_COOKIE: "true"
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: noreply@vacancy-test.atu.kz
  MAIL_FROM_NAME: VACANCY-TEST.ATU.KZ
  OPENAI_API_KEY: ""
  TEACHER_AUDIT_API_KEY: ""
  TEACHER_AUDIT_VERIFY_SSL: "true"
  TELESCOPE_ENABLED: "false"
  RUN_MIGRATIONS: "false"
  RUN_OPTIMIZE: "false"

services:
  app:
    image: hr-test-atu-app:${HR_TEST_RELEASE:-latest}
    build:
      context: .
      target: app
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      <<: *test-env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  queue:
    image: hr-test-atu-app:${HR_TEST_RELEASE:-latest}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--timeout=120"]
    environment:
      <<: *test-env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  nginx:
    image: hr-test-atu-nginx:${HR_TEST_RELEASE:-latest}
    build:
      context: .
      target: nginx
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    ports:
      - "127.0.0.1:8142:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40", "--innodb-use-native-aio=OFF"]
    environment:
      MYSQL_DATABASE: hr_test
      MYSQL_USER: hr_test
      MYSQL_PASSWORD: ${HR_TEST_DB_PASSWORD:?HR_TEST_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${HR_TEST_DB_ROOT_PASSWORD:?HR_TEST_DB_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  storage_data:

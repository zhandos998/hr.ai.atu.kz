server {
    listen 80;
    listen [::]:80;
    server_name vacancy-test.atu.kz;
    return 301 https://vacancy-test.atu.kz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vacancy-test.atu.kz;

    ssl_certificate /etc/ssl/atussl/ssl-bundle.crt;
    ssl_certificate_key /etc/ssl/atussl/atu.key;

    client_max_body_size 64m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Environment "vacancy-test" always;
    access_log /var/log/nginx/vacancy-test_access.log;
    error_log /var/log/nginx/vacancy-test_error.log;

    location / {
        proxy_pass http://127.0.0.1:8142;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
